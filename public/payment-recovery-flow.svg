    <rect x="20" y="20" width="90" height="70" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(239,68,68,0.5)" stroke-width="1.5"/>
    <rect x="35" y="35" width="60" height="40" rx="6" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <line x1="95" y1="25" x2="105" y2="35" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="105" y1="25" x2="95" y2="35" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
    <text x="65" y="105" fill="#94a3b8" font-size="12" font-family="Inter, sans-serif" text-anchor="middle">Failed</text>
