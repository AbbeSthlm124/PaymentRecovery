    <rect x="290" y="20" width="90" height="70" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(20,184,166,0.5)" stroke-width="1.5"/>
    <rect x="305" y="35" width="60" height="40" rx="6" fill="none" stroke="#14b8a6" stroke-width="2"/>
    <path d="M365 30 L370 35 L378 25" fill="none" stroke="#14b8a6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="335" y="105" fill="#94a3b8" font-size="12" font-family="Inter, sans-serif" text-anchor="middle">Recovered</text>
  </g>
</svg>
